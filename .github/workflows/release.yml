name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      gateway_dev:
        description: Build only a SHA-tagged gateway development image
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    if: github.repository_owner == 'spindle-studio' && github.ref == 'refs/heads/main' && !inputs.gateway_dev
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      nodes_created: ${{ steps.release.outputs['nodes--release_created'] }}
      nodes_tag: ${{ steps.release.outputs['nodes--tag_name'] }}
      gateway_created: ${{ steps.release.outputs['gateway--release_created'] }}
      gateway_tag: ${{ steps.release.outputs['gateway--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          # Use an app/PAT token to trigger CI on the generated release PRs.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          target-branch: main

  publish-nodes:
    needs: release
    if: needs.release.outputs.nodes_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    defaults:
      run:
        working-directory: nodes
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.nodes_tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          registry-url: https://registry.npmjs.org
          cache: npm
          cache-dependency-path: nodes/package-lock.json
      - name: Validate node release version
        id: version
        working-directory: .
        env:
          RELEASE_TAG: ${{ needs.release.outputs.nodes_tag }}
        run: python3 .github/scripts/release_version.py nodes "$RELEASE_TAG"
      - run: npm ci
      - name: Publish nodes with provenance
        # prepublishOnly runs lint and build before uploading.
        run: npm publish --provenance --access public --tag "$NPM_DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          NPM_DIST_TAG: ${{ steps.version.outputs.npm_tag }}

  prepare-gateway:
    needs: release
    if: >-
      !cancelled() && github.repository_owner == 'spindle-studio' &&
      (needs.release.outputs.gateway_created == 'true' ||
      (github.event_name == 'workflow_dispatch' && inputs.gateway_dev))
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.source.outputs.sha }}
      metadata: ${{ steps.metadata.outputs.json }}
      labels: ${{ steps.metadata.outputs.labels }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.gateway_tag || github.sha }}
      - name: Identify image source
        id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Validate gateway release version
        if: needs.release.outputs.gateway_created == 'true'
        id: version
        env:
          RELEASE_TAG: ${{ needs.release.outputs.gateway_tag }}
        run: python3 .github/scripts/release_version.py gateway "$RELEASE_TAG"
      - uses: docker/metadata-action@v5
        id: metadata
        with:
          images: ghcr.io/spindle-studio/n8n-matrix-e2ee-gateway
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ steps.version.outputs.version }},enable=${{ needs.release.outputs.gateway_created == 'true' }}
            type=raw,value=${{ steps.source.outputs.sha }}
            type=raw,value=latest,enable=${{ needs.release.outputs.gateway_created == 'true' && steps.version.outputs.stable == 'true' }}
          labels: |
            org.opencontainers.image.source=https://github.com/spindle-studio/n8n-matrix-e2ee
            org.opencontainers.image.revision=${{ steps.source.outputs.sha }}
            org.opencontainers.image.licenses=MIT

  build-gateway:
    needs: prepare-gateway
    if: ${{ !cancelled() && needs.prepare-gateway.result == 'success' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-gateway.outputs.sha }}
      - name: Test gateway
        working-directory: gateway
        run: cargo test --locked
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push platform image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: gateway
          file: gateway/Dockerfile
          platforms: linux/${{ matrix.arch }}
          labels: ${{ needs.prepare-gateway.outputs.labels }}
          outputs: type=image,name=ghcr.io/spindle-studio/n8n-matrix-e2ee-gateway,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=min
          cache-from: type=gha,scope=gateway-${{ matrix.arch }}
          cache-to: type=gha,scope=gateway-${{ matrix.arch }},mode=max
      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish-gateway:
    needs: [prepare-gateway, build-gateway]
    if: ${{ !cancelled() && needs.prepare-gateway.result == 'success' && needs.build-gateway.result == 'success' }}
    runs-on: ubuntu-24.04
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: gateway-digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Publish multi-platform image tags
        working-directory: ${{ runner.temp }}/digests
        env:
          METADATA: ${{ needs.prepare-gateway.outputs.metadata }}
          IMAGE: ghcr.io/spindle-studio/n8n-matrix-e2ee-gateway
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          args=()
          for tag in "${tags[@]}"; do
            args+=(--tag "$tag")
          done
          digests=(*)
          test "${#digests[@]}" -eq 2
          for digest in "${digests[@]}"; do
            args+=("$IMAGE@sha256:$digest")
          done
          docker buildx imagetools create "${args[@]}"
          docker buildx imagetools inspect "${tags[0]}"
