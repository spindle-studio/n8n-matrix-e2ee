[package]
name = "n8n-matrix-e2ee-gateway"
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/spindle-studio/n8n-matrix-e2ee"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws"] }
futures-util = "0.3"
matrix-sdk = { version = "0.18", default-features = false, features = ["e2e-encryption", "sqlite"] }
mime = "0.3"
ogg = "0.9"
opus-decoder = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
ruma = { version = "0.16", features = ["unstable-msc3245-v1-compat"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tokio-tungstenite = "0.29"
